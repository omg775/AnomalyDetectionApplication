spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:1}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

# Schema migrations (see docs/DATABASE_MIGRATIONS.md)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Flyway needs two connections at once. With the Hikari pool capped at 1 it would
# deadlock, so it gets its own short-lived unpooled connection instead.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Anomaly Detection Rules
anomaly.rule.bytes-transferred.high=200000
anomaly.rule.bytes-transferred.critical=500000
anomaly.rule.suspicious-ports=21,23,3389
# Number of unprocessed traffic records handled per detection transaction
detection.batch-size=1000

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}

# CORS: comma-separated frontend origins. Empty means no cross-origin access;
# "*" is only accepted with the dev profile (see application-dev.properties).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Actuator: only health (with liveness and readiness probes) is public, see SecurityConfig
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# ML service (FastAPI)
ml.service.base-url=${ML_SERVICE_BASE_URL:http://127.0.0.1:8010}
# Algorithm used when a request does not name one (must match the ML service default)
ml.service.default-algorithm=isolation_forest
# Shared secret sent as X-API-Key; must match ML_API_KEY of the ML service
ml.service.api-key=${ML_API_KEY:}
ml.service.connect-timeout-ms=3000
ml.service.read-timeout-ms=15000

# Login brute-force protection (per client IP and per username)
app.security.login.max-failures=5
app.security.login.window=15m

# CSV import
csv.import.max-rows=${CSV_MAX_ROWS:100000}
csv.import.batch-size=500
csv.import.allowed-protocols=${CSV_ALLOWED_PROTOCOLS:TCP,UDP,ICMP}

# Alerts read per batch for ML training input and prediction requests
ml.feature.batch-size=5000
