# Test-only configuration. This file shadows src/main/resources/application.properties
# on the test classpath, so tests never touch a real database or need real
# secrets. Everything here is an in-memory H2 instance and throwaway values.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate

# The schema comes from the same Flyway migrations as production.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Flyway needs two connections at once. With the Hikari pool capped at 1 it would
# deadlock, so it gets its own short-lived unpooled connection instead.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Anomaly Detection Rules (same defaults as production)
anomaly.rule.bytes-transferred.high=200000
anomaly.rule.bytes-transferred.critical=500000
anomaly.rule.suspicious-ports=21,23,3389
detection.batch-size=1000

# Security Configuration (throwaway test-only values, never used in prod)
jwt.secret=test-only-secret-key-0123456789abcdef0123456789abcdef
jwt.expiration=86400000
app.security.admin.username=admin
# BCrypt hash of "test-password"
app.security.admin.password=$2a$10$8HoWwWRRWEbPLJDrflKeW.y.azKFI8OdcJwRz3QYWW46XWkKIiuPS

app.cors.allowed-origins=http://localhost:5173

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# ML service (unreachable in tests by design; tests that need it mock MlServiceClient)
ml.service.base-url=http://127.0.0.1:8010
ml.service.api-key=test-ml-api-key
ml.service.connect-timeout-ms=500
ml.service.read-timeout-ms=500

# CSV import
csv.import.max-rows=100000
csv.import.batch-size=500
csv.import.allowed-protocols=TCP,UDP,ICMP
